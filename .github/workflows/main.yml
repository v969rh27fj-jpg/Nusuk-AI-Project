
name: Nusuk AI Automatic Update and APK Build

on:
  push:
    branches:
      - project-update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: project-update
          fetch-depth: 0

      - name: Find and Extract Updated ZIP
        run: |
          ZIP="Nusuk-AI-Project-Updated.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Updated ZIP not found!"
            ls -la
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/unpacked"

          if [ ! -d "$RUNNER_TEMP/unpacked/Nusuk-AI" ]; then
            echo "ERROR: Nusuk-AI folder not found!"
            exit 1
          fi

      - name: Update Project Source Code
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/main.yml' \
            --exclude='Nusuk-AI-Project-Updated.zip' \
            "$RUNNER_TEMP/unpacked/Nusuk-AI/" ./

          rm -f Nusuk-AI-Project-Updated.zip

      - name: Save Updated Source Code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update Nusuk AI Android source"
            git push origin HEAD:project-update
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nusuk-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
