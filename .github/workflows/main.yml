
name: Build Nusuk AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Find and Extract Project ZIP
        run: |
          mkdir -p project
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          unzip -q "$ZIP" -d project

      - name: Fix XML Namespace
        run: |
          find project -name activity_onboarding.xml -exec sed -i 's#http://schemas.android.com/apk/res/auto#http://schemas.android.com/apk/res-auto#g' {} +

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android Project
        run: |
          GRADLE_FILE=$(find project -name build.gradle.kts -not -path "*/app/*" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Android Gradle project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nusuk-AI-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
