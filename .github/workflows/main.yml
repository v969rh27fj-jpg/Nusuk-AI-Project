
name: Build Nusuk AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Extract ZIP
        run: |
          unzip -q Nusuk-AI-Project.zip -d project

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd project/Nusuk-AI
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nusuk-AI-debug-apk
          path: project/Nusuk-AI/app/build/outputs/apk/debug/*.apk
