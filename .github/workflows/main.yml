
name: Build Nusuk AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Extract Project ZIP
        run: |
          unzip -q Nusuk-AI-Project.zip -d project

      - name: Locate Gradle Project
        run: |
          find project -name gradlew -type f

      - name: Build APK
        run: |
          chmod +x project/gradlew
          cd project
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nusuk-AI-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
